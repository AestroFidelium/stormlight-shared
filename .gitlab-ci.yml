# GitLab CI — engine repo. Runs entirely inside this repo's Nix flake dev shell
# (`flake.nix` provides cargo + clippy + rustfmt + nextest + every Bevy system
# lib), so the toolchain matches local dev exactly. `RUSTFLAGS=-D warnings`
# enforces the project's zero-warning policy; dependency warnings are capped to
# `allow` by cargo, so only our own crates can fail it.
stages:
  - check
  - test

default:
  image: nixos/nix:latest

variables:
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo-home"
  CARGO_TERM_COLOR: "always"
  RUSTFLAGS: "-D warnings"
  # Flakes are not on by default in the nixos/nix image.
  NIX_CONFIG: "experimental-features = nix-command flakes"

# Cache the cargo registry + build artifacts on Cargo.lock. (The Nix store
# itself is restored from cache.nixos.org each run; a leaner CI dev shell is a
# future optimization.)
.cargo_cache: &cargo_cache
  cache:
    key:
      files: [Cargo.lock]
    paths:
      - .cargo-home/
      - target/

# `modloader` depends on `stormlight_mod_abi` via the relative path dep
# `../sdk/schema`, so any cargo command needs the `sdk` repo checked out next
# to this one — CI does not do that by default. This includes `cargo fmt --all`,
# which resolves the graph via `cargo metadata` (not `--no-deps`) and dies at
# manifest load without it. Clone it with CI_JOB_TOKEN (this project must be on
# sdk's CI/CD job-token allowlist). Match the current branch when sdk has it,
# else fall back to main, so a coordinated cross-repo change builds against its
# own branch.
.clone_siblings: &clone_siblings
  - |
    clone_sibling() {
      name="$1"
      url="https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_NAMESPACE}/${name}.git"
      ref="$CI_COMMIT_REF_NAME"
      git ls-remote --exit-code --heads "$url" "$ref" >/dev/null 2>&1 || ref="main"
      echo "cloning sibling ${name}@${ref}"
      git clone --depth 1 --branch "$ref" "$url" "../${name}"
    }
    clone_sibling sdk

fmt:
  stage: check
  <<: *cargo_cache
  before_script: *clone_siblings
  script:
    # Scope to this repo's crates, not `--all`: `--all` also reformats local
    # path-based dependencies, i.e. the `sdk` sibling, so shared's fmt would
    # fail on sdk's formatting — sdk owns that via its own CI. (Siblings are
    # still cloned above because `cargo metadata` reads the path-dep manifest.)
    - nix develop --command cargo fmt --check -p stormlight_shared -p stormlight_modloader

clippy:
  stage: check
  <<: *cargo_cache
  before_script: *clone_siblings
  script:
    - nix develop --command cargo clippy --all-targets -- -D warnings

nextest:
  stage: test
  <<: *cargo_cache
  before_script: *clone_siblings
  script:
    - nix develop --command cargo nextest run --no-fail-fast
