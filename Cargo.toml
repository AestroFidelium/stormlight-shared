# `shared` repo — code shared by server and client. Public.
# A small workspace: the protocol/balance/macros library + the WASM modloader
# host (used by both server and client to load mods). Cross-repo path deps point
# at sibling repos under the umbrella `stormlight/` folder.
[workspace]
resolver = "2"
members = ["protocol", "modloader"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://gitlab.com/stormlight/shared"

[workspace.dependencies]
# Wire protocol + host are headless: no rendering. Default features pull the
# full graphics stack, and because the server unifies features across the dep
# graph, that dragged `bevy_render`/winit/wgpu into the dedicated server too.
# Members opt into the non-render features they need (e.g. `serialize`).
bevy = { version = "0.18.1", default-features = false }
lightyear = "=0.26.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_yaml = "0.9.34"
anyhow = "1.0.100"
tracing = "0.1.43"
tracing-appender = "0.2.4"
tracing-subscriber = "0.3.22"
derive_more = "2.1.1"
regex = "1.12.2"
wasmtime = { version = "26", default-features = false }
zip = "2"
# Cross-repo: the mod ABI lives in the sibling `sdk` repo.
stormlight_mod_abi = { path = "../sdk/schema" }
bolero = "0.13"
divan = "0.1"
bincode = { version = "2.0.1", features = ["serde"] }

# Lints relaxed by request — only forbid unsafe; clippy style is free choice.
[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3
[profile.fuzz]
inherits = "dev"
opt-level = 3
incremental = false
codegen-units = 1
