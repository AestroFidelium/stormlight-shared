# `shared` repo — code shared by server and client. Public.
# A small workspace: the protocol/balance/macros library, the WASM modloader
# host (used by both server and client to load mods), and the shared walkable-map
# geometry both ends must agree on. The one cross-repo dep (the mod ABI) is a
# git dep on the public `sdk` repo.
[workspace]
resolver = "2"
members = ["protocol", "modloader", "navigation"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/AestroFidelium/stormlight-shared"

[workspace.dependencies]
# Wire protocol + host are headless: no rendering. Default features pull the
# full graphics stack, and because the server unifies features across the dep
# graph, that dragged `bevy_render`/winit/wgpu into the dedicated server too.
# Members opt into the non-render features they need (e.g. `serialize`).
bevy = { version = "0.18.1", default-features = false }
lightyear = "=0.26.4"
# Low-level (de)serialization primitives (`Writer`/`Reader`/`SerializeFns`).
# Pinned to lightyear's own transitive version so the codec plugs into
# `register_component_custom_serde` byte-for-byte.
lightyear_serde = "=0.26.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_yaml = "0.9.34"
anyhow = "1.0.100"
tracing = "0.1.43"
tracing-appender = "0.2.4"
tracing-subscriber = "0.3.22"
derive_more = "2.1.1"
regex = "1.12.2"
wasmtime = { version = "26", default-features = false }
# Only `deflate` (what `SimpleFileOptions::default()` writes) and the always-present
# stored method. The default feature set adds bzip2/lzma/xz/zstd/deflate64 — five
# codecs no mod package uses, two of which build C and so need a cross-compiler
# configured for every target the engine ships to.
zip = { version = "2", default-features = false, features = ["deflate"] }
# Cross-repo: the mod ABI lives in the `sdk` repo. A git dep so this repo builds
# when cloned on its own; the umbrella folder's `.cargo/config.toml` patches it
# back to the sibling checkout for local development.
stormlight_mod_abi = { git = "https://github.com/AestroFidelium/stormlight-sdk.git", branch = "main" }
# The walkable region both ends route over; the mover law needs the geometry it
# is walking, so `protocol` depends on `navigation` and never the other way.
stormlight_navigation = { path = "navigation" }
bolero = "0.13"
divan = "0.1"
bincode = { version = "2.0.1", features = ["serde"] }

# Lints relaxed by request — only forbid unsafe; clippy style is free choice.
[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3
[profile.fuzz]
inherits = "dev"
opt-level = 3
incremental = false
codegen-units = 1
