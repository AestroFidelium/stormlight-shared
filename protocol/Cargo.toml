[package]
name = "stormlight_shared"
description = "Wire protocol, balance constants, and declarative ECS macros — shared by server and client. Zero game content."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
bevy = { workspace = true, features = ["serialize"] }
lightyear = { workspace = true, features = ["netcode", "udp", "input_native", "crossbeam"] }
lightyear_serde = { workspace = true }
serde = { workspace = true }
serde_yaml = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }
derive_more = { workspace = true }
regex = { workspace = true }

[dev-dependencies]
bincode = { workspace = true }
bolero = { workspace = true }
divan = { workspace = true }

[features]
dev = ["bevy/dynamic_linking"]

[[test]]
name = "property"
path = "tests/property/main.rs"
[[test]]
name = "fuzz"
path = "tests/fuzz/main.rs"
[[test]]
name = "integration"
path = "tests/integration/main.rs"
[[test]]
name = "systems"
path = "tests/systems/main.rs"

[[bench]]
name = "protocol"
harness = false
