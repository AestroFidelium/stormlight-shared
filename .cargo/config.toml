# Linker: clang + mold (Linux). Provided by the repo's flake.
[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

# Native Windows cross-build (driven by GitLab CI), mingw-w64 from the flake.
[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"

[alias]
# The ONLY blessed test runner — never `cargo test`.
t = "nextest run"
lint = "clippy --all-targets"

# No cranelift backend: it breaks cargo-fuzz / cargo-llvm-cov instrumentation,
# and this project is fuzzing-first. Build speed comes from mold + opt-deps.
